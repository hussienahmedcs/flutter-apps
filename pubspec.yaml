name: wordstory
description: A mobile‑first, offline‑capable Progressive Web App for learning English vocabulary through sessions, flashcards and stories.
publish_to: 'none'

# The following environment declaration allows your package to run on the 
# Dart SDK versions specified. We use a broad range so the project is
# compatible with the current stable release of Flutter 3 and later minor
# versions. Don't change this unless you understand what you are doing.
environment:
  sdk: ">=2.17.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  provider: ^6.1.5
  firebase_core: ^3.13.1
  firebase_auth: ^5.5.4
  cloud_firestore: ^5.5.4
  google_sign_in: ^6.2.1
  flutter_tts: ^4.2.3
  csv: ^6.0.0
  file_picker: ^10.2.0
  intl: ^0.20.2
  path_provider: ^2.0.11
  shared_preferences: ^2.0.15
  flutter_markdown: ^0.7.7+1
  firebase_storage: ^12.4.10
  flip_card: ^0.6.0
  flutter_spinkit: ^5.2.0
  image_picker: ^1.1.2
  share_plus: ^11.0.0
  app_links: ^6.4.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/icon/icon.png"

flutter:
  uses-material-design: true